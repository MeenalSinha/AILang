[package]
name = "ail"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The AILang command-line tool: run, build, check, fmt, repl, test, init, new."

[[bin]]
name = "ail"
path = "src/main.rs"

[dependencies]
ailang-lexer = { workspace = true }
