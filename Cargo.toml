[workspace]
resolver = "2"
members = [
    "compiler/diagnostics",
    "compiler/ast",
    "compiler/lexer",
    "compiler/parser",
    "compiler/types",
    "compiler/semantic",
    "compiler/runtime",
    "compiler/interpreter",
    "compiler/optimizer",
    "cli",
    "repl",
    "formatter",
    "package_manager",
    "language_server",
    "benches",
    "ai_runtime",
    # v3.0: Intelligence Kernel and new crates
    "kernel",
    "memory_fabric",
    "application",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["AILang Team"]
license = "MIT"
repository = "https://github.com/MeenalSinha/AILang"

[workspace.dependencies]
ailang-diagnostics = { path = "compiler/diagnostics" }
ailang-ast = { path = "compiler/ast" }
ailang-lexer = { path = "compiler/lexer" }
ailang-parser = { path = "compiler/parser" }
ailang-types = { path = "compiler/types" }
ailang-semantic = { path = "compiler/semantic" }
ailang-runtime = { path = "compiler/runtime" }
ailang-interpreter = { path = "compiler/interpreter" }
ailang-optimizer = { path = "compiler/optimizer" }
ailang-ai-runtime = { path = "ai_runtime" }
ailang-fmt = { path = "formatter" }
ailang-pm = { path = "package_manager" }
# v3.0 crates
ailang-kernel = { path = "kernel" }
ailang-memory-fabric = { path = "memory_fabric" }
ailang-application = { path = "application" }

logos = "0.14"
thiserror = "1.0"
miette = { version = "7.2", features = ["fancy"] }
ariadne = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "~4.4", features = ["derive"] }
anyhow = "1.0"
insta = "1.39"
criterion = "0.5"

indexmap = "=2.2.6"

[profile.release]
opt-level = 3
lto = true
